<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">The gnomonic projection as a lit celestial sphere and tangent plane</title>
<desc id="desc">A cross-section shows a point light at the centre of a sphere. Rays pass through star holes at zero, twenty, forty and sixty degrees and meet a tangent plane progressively farther from its centre. The ninety-degree ray is parallel to the plane and never meets it, while a far-side star is outside the valid projection.</desc>
<style>
text{font-family:system-ui,sans-serif;fill:#242321}.head{font-size:27px;font-weight:600}.label{font-size:20px}.small{font-size:17px;fill:#5f5b54}.sphere{fill:#f8f7f3;stroke:#555;stroke-width:3}.plane{stroke:#2d2d2b;stroke-width:5}.ray{stroke:#a24735;stroke-width:2.5;fill:none}.limit{stroke:#777;stroke-width:2.5;stroke-dasharray:10 8;fill:none}.hole{fill:white;stroke:#222;stroke-width:3}.mark{fill:#a24735}.quiet{stroke:#aaa;stroke-width:1.5;fill:none}.arrow{marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#777"/></marker></defs>
<rect width="1280" height="720" fill="white"/>
<text x="640" y="42" text-anchor="middle" class="head">Gnomonic projection: light from the centre onto a tangent plane</text>
<!-- celestial sphere cross-section -->
<circle cx="360" cy="390" r="190" class="sphere"/>
<text x="360" y="620" text-anchor="middle" class="label">celestial sphere (cross-section)</text>
<!-- tangent paper -->
<line x1="550" y1="82" x2="550" y2="650" class="plane"/>
<text x="580" y="678" class="label">tangent plane — the chart</text>
<!-- central light -->
<circle cx="360" cy="390" r="13" fill="#f2c84b" stroke="#6d5a17" stroke-width="2"/>
<g stroke="#c49d25" stroke-width="2"><line x1="360" y1="361" x2="360" y2="343"/><line x1="360" y1="419" x2="360" y2="437"/><line x1="331" y1="390" x2="313" y2="390"/><line x1="389" y1="390" x2="407" y2="390"/></g>
<text x="313" y="424" text-anchor="end" class="label">point light</text>
<!-- rays: 0,20,40,60 degrees -->
<line x1="360" y1="390" x2="550" y2="390" class="ray"/><circle cx="550" cy="390" r="7" class="mark"/>
<line x1="360" y1="390" x2="550" y2="321" class="ray"/><circle cx="538.5" cy="325" r="7" class="hole"/><circle cx="550" cy="321" r="7" class="mark"/>
<line x1="360" y1="390" x2="550" y2="231" class="ray"/><circle cx="505.6" cy="268" r="7" class="hole"/><circle cx="550" cy="231" r="7" class="mark"/>
<line x1="360" y1="390" x2="550" y2="61" class="ray"/><circle cx="455" cy="225.5" r="7" class="hole"/><circle cx="550" cy="61" r="7" class="mark"/>
<!-- central pinhole at tangency -->
<circle cx="550" cy="390" r="9" class="hole"/><circle cx="550" cy="390" r="5" class="mark"/>
<!-- 90 degree limiting ray -->
<line x1="360" y1="390" x2="360" y2="91" class="limit"/>
<circle cx="360" cy="200" r="7" class="hole"/>
<text x="382" y="116" class="label">90°: ray is parallel to the plane</text>
<text x="382" y="142" class="small">no finite point on the chart</text>
<!-- far side ray -->
<circle cx="195.5" cy="295" r="7" class="hole"/>
<line x1="360" y1="390" x2="195.5" y2="295" class="limit"/>
<text x="52" y="245" class="label">far hemisphere</text>
<text x="52" y="271" class="small">outside the valid domain</text>
<!-- angle arc and labels -->
<path d="M416 390A56 56 0 0 0 388 341.5" class="quiet"/>
<text x="418" y="357" class="small">t</text>
<text x="575" y="397" class="small">0° — no radial stretching</text>
<text x="575" y="328" class="small">20°</text>
<text x="575" y="238" class="small">40°</text>
<text x="575" y="68" class="small">60° — much farther out</text>
<!-- distance guide -->
<line x1="725" y1="390" x2="725" y2="61" class="quiet"/>
<line x1="710" y1="390" x2="740" y2="390" class="quiet"/><line x1="710" y1="321" x2="740" y2="321" class="quiet"/><line x1="710" y1="231" x2="740" y2="231" class="quiet"/><line x1="710" y1="61" x2="740" y2="61" class="quiet"/>
<text x="755" y="188" class="label">distance on paper grows as tan(t)</text>
<text x="755" y="219" class="small">gently near the centre, then ever faster</text>
<!-- reader cue -->
<path d="M890 300C820 350 720 360 585 363" class="limit arrow"/>
<text x="905" y="286" class="label">the central neighbourhood</text>
<text x="905" y="313" class="small">is where the projection is at its gentlest</text>
</svg>
