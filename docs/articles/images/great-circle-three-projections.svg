<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 410" role="img" aria-labelledby="title desc">
<title id="title">One great circle under three projections</title>
<desc id="desc">The same great circle is shown as a straight line in a gnomonic plane, a circle in a stereographic plane, and an ellipse clipped by the limb in an orthographic plane.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#202020}.head{font-size:25px}.small{font-size:17px}.frame{fill:white;stroke:#999;stroke-width:1.5}.curve{fill:none;stroke:#9b3f2f;stroke-width:4}.point{fill:#202020}.grid{stroke:#ddd;stroke-width:1}</style>
<rect width="1320" height="410" fill="white"/>
<g transform="translate(30 58)"><text x="175" y="-18" text-anchor="middle" class="head">Gnomonic</text><rect width="350" height="280" class="frame"/><path d="M0 70L350 220" class="curve"/><g class="point"><circle cx="45" cy="89" r="5"/><circle cx="175" cy="145" r="5"/><circle cx="305" cy="201" r="5"/></g><text x="175" y="315" text-anchor="middle" class="small">great circles stay straight</text></g>
<g transform="translate(485 58)"><text x="175" y="-18" text-anchor="middle" class="head">Stereographic</text><rect width="350" height="280" class="frame"/><circle cx="175" cy="140" r="104" class="curve"/><g class="point"><circle cx="105" cy="63" r="5"/><circle cx="252" cy="70" r="5"/><circle cx="270" cy="188" r="5"/></g><text x="175" y="315" text-anchor="middle" class="small">a circle (or a line through the centre)</text></g>
<g transform="translate(940 58)"><text x="175" y="-18" text-anchor="middle" class="head">Orthographic</text><rect width="350" height="280" class="frame"/><circle cx="175" cy="140" r="125" fill="none" stroke="#777" stroke-width="2"/><ellipse cx="175" cy="140" rx="118" ry="60" transform="rotate(-22 175 140)" class="curve"/><g class="point"><circle cx="74" cy="154" r="5"/><circle cx="175" cy="140" r="5"/><circle cx="276" cy="126" r="5"/></g><text x="175" y="315" text-anchor="middle" class="small">an ellipse inside the visible limb</text></g>
</svg>
