# ---------------------------------------------------------------
# Kartets tastatur (#350)
# ---------------------------------------------------------------
#
# Hver setning er HEL. Panelet satte elleve av dem sammen med
# strengaddisjon i Java, og da kunne en oversettelse bare komme ut i
# engelsk rekkefølge. Prøvesteinen er `spoken.unavailable`: et navn,
# en betingelse som nevner en annen bryter, og to tastetrykk.
#
# En hovedbryter oppgir to former av navnet sitt, fordi en etikett
# ikke er en setningsdel. `master.enable` er det som leses etter
# «slå på»; `master.on` er en hel setningsdel.
#
# HVER bryter oppgir enten en merknad eller `!none`. Merknadene
# forklarer hvorfor bokstaven her er en annen enn den på bryterens
# egen kontroll, og det er et forhold ved DETTE språket.

