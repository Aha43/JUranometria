# ---- Eksport av kartark (#350) ------------------------------------
# Én reise: dialogen, filvelgerens egen tittel, spørsmålet om å
# erstatte og hvert utfall. Leseren møter alt sammen etter å ha
# trykket Eksporter.
#
# SVG, PDF, PNG, A4 og US Letter er format- og papiridentiteter, ikke
# ord. De kommer inn som argumenter og står aldri skrevet inn i en
# verdi her. Filnavn, mapper og tall er data; byte-tallet kommer inn
# som et tall, så hvert språk grupperer det på sin egen måte.

