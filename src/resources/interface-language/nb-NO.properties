# JUranometria på norsk bokmål (Sprint 33, issue #350).
#
# ---------------------------------------------------------------
# STATUS: REVIEWED. The manifest beside this file is where that is
# recorded; this header describes it and does not declare it.
# ---------------------------------------------------------------
#
# These are original translations written for this application, not
# taken from any source - unlike the constellation names, which are a
# reviewed catalogue with its own provenance. That makes their
# accuracy a matter of judgement rather than of citation, and
# judgement about Norwegian wording is the owner's.
#
# The owner has been through every surface this sprint covers. That
# is "reviewed" and deliberately not "verified": in this repository
# verified means checked against a source that could contradict it,
# and for an original translation no such source exists.
#
# nb-NO.manifest states status=reviewed, and the twelve study
# companions read it from there through
# juranometria.tool.InterfaceLanguageStatus. Nothing states a status
# in prose of its own, here or in Java.
#
# A key absent here falls back to English, visibly and on purpose, so
# an incomplete file is a legitimate state and nothing reaches a
# reader as a key. No reader-facing application prose relies on that
# any more; what is deliberately left in English or left untranslated
# is listed in the manifest, with a reason for each.
#
# Terms kept deliberately:
#
#   "Latin (IAU)"  a nomenclature, not a language the atlas speaks
#   --dark         a command-line flag, typed exactly as written

