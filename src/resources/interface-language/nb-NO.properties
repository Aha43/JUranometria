# et desimalkomma eller en lokalisert måned ville gjort leserens egen
# innskriving uleselig. De står ikke i noen verdi her. `UTC` er en
# tidsskalaidentitet og sendes inn som argument.
#
# Tilgangsbokstavene er valgt fra de norske ordene, på begge veier:
# kontroller og feltetiketter.

