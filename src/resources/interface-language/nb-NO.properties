solarsystem.mars.onChart.explain = Viser eller skjuler Mars på kartet der den står for karttiden og stedet, med fasen slik tabellen oppgir den, i sann størrelse eller som et kartografisk symbol på 6 piksler, det som er størst. Phobos og Deimos tegnes sammen med den fra 2000 til 2049 som symboler på 3 piksler der de står, hver bare der merket står klar av Mars og av den andre månen: en fylt prikk klar av Mars, en prikk med en ring i sidens bunnfarge foran den, en hul ring i skyggen; en måne bak Mars, eller for nær til å skjelnes i feltet, tegnes ikke, og siden sier fra. Samme valg som i Vis.
