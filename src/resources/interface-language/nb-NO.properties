venustable.column.diameter.explain = Hvor stor Venus' faste kropp ser ut, i bueminutter og buesekunder, ut fra radien på 6051,8 km. Det synlige skydekket er omtrent 1,22 % større, avhengig av bølgelengden - høyst 0,77″ større mellom 1900 og 2100. Det oppgis her, men tegnes ikke.
