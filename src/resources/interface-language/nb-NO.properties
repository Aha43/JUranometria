# ---- Jupiter og de fire galileiske månene (#474, tabellen avgjort i #472) ----
jupitertable.title = Jupiter
jupitertable.a11y = Jupitertabell
jupitertable.explain = Hvor Jupiter og de fire store månene er, beregnet fra de medfølgende efemeridene for karttiden og observasjonsstedet: Jupiters posisjon, høyde, avstand, tilsynelatende størrelse, belyst andel og pol, og for Io, Europa, Ganymedes og Callisto hvilken side av Jupiter de er på, avstanden øst–vest og nord–sør, avstanden fra Jupiter og om hver er klar av Jupiter, foran, bak eller i skyggen. Kartet tegner Jupiter bare mens Jupiter og månene på kartet er på.
jupitertable.view.instant.a11y = Vis Jupiter og månene ved karttiden
jupitertable.view.instant.explain = Viser Jupiter ved karttiden, og under den de fire månene i fast rekkefølge.
jupitertable.view.range.a11y = Vis de fire månene over et tidsrom
jupitertable.view.range.explain = Viser de fire månene for hvert steg fra starten til slutten, begge medregnet, gruppert under hvert tidspunkt; en slutt som ikke ligger på rutenettet, legges til som siste gruppe og merkes. Dette er utvalgte tidspunkter; tabellen leter ikke etter øyeblikket en måne går inn på eller ut av Jupiterskiven.
jupitertable.close.a11y = Lukk Jupitertabellen
jupitertable.time.note = Datoer før {0} og etter {1} bruker en beregnet klokkekorreksjon. Etter 2026 kan usikkerheten i lokale horisontkoordinater ennå ikke angis presist. Virkningen på J2000-posisjonen på kartet holder seg under 3″ fram til 2100 med den valgte modellen; der er månenes tilstand geometrien ved et beregnet tidspunkt, ikke forutsagte tidspunkter for hendelser.
