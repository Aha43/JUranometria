venustable.column.illuminated.explain = Hvor mye av Venus-skiven som er belyst, i prosent av hele skiven.
venustable.column.phase = Fase
venustable.column.phase.explain = Fasen slik leseren ser den: foran Solen eller bak Solen når Venus-skiven møter Solens; ellers nær nedre konjunksjon, sigd, nær halvt belyst, mer enn halvt belyst eller nær full, etter hvor mye av skiven som er belyst. «Nær» merker et bånd, ikke et nøyaktig tidspunkt.
