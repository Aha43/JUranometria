# ---------------------------------------------------------------
# Den tegnede siden, og filene den eksporteres til (#350)
# ---------------------------------------------------------------
#
# Disse når en leser på tre måter: tittelfeltet som tegnes på kartet,
# beskrivelsen en skjermleser hører, og metadataene som skrives inne
# i hver eksporterte SVG, PDF og PNG.
#
# HVERT TALL ER ET ARGUMENT, allerede formatert med Locale.ROOT av
# den som kaller. En magnitudegrense på 6.0 er 6.0 for enhver leser;
# 6,0 i et tittelfelt ville vært et annet tall for halvparten av dem.
# Ingen språk formaterer om en kartverdi, og ingen kan: de kommer som
# tekst.
#
# Kanonisk og uoversatt: ICRS J2000, RA, Dec, V, gradtegnet,
# skilletegnet, mm, A4, programmets navn, versjon og nettadresse.
#
# Bayer og Flamsteed er katalognavn og står som de er.

