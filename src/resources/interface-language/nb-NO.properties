saturntable.title = Saturn
saturntable.a11y = Saturntabell
saturntable.explain = Hvor Saturn, ringene og de sju månene er, beregnet fra de medfølgende efemeridene for karttiden og observasjonsstedet: Saturns posisjon, høyde, avstand, tilsynelatende størrelse, belyst andel og pol, hvor langt ringene er åpnet mot deg og mot Solen og hvor store de ser ut, og for Mimas, Enceladus, Tethys, Dione, Rhea, Titan og Iapetus hvilken side av Saturn de er på, avstanden øst–vest og nord–sør, avstanden fra Saturn og om hver er klar av Saturn, foran, bak eller i skyggen. Saturn og ringene tegnes på kartet med Saturn på kartet; de sju månene sammen med den, som symboler på 3 piksler med sine tilstander.
saturntable.view.instant.a11y = Vis Saturn og månene ved karttiden
saturntable.view.instant.explain = Viser Saturn og ringene ved karttiden, og under dem de sju månene i fast rekkefølge, utover fra Saturn.
saturntable.view.range.a11y = Vis de sju månene over et tidsrom
saturntable.view.range.explain = Viser Saturns sammendrag og de sju månene for hvert steg fra starten til slutten, begge medregnet, gruppert under hvert tidspunkt; en slutt som ikke ligger på rutenettet, legges til som siste gruppe og merkes. Dette er utvalgte tidspunkter; tabellen leter ikke etter øyeblikket en måne går inn på eller ut av Saturnskiven eller skyggen.
