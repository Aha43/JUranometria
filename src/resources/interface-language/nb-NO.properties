menu.mars.explain = Åpner en tabell over Mars' beregnede posisjon, høyde, avstand, størrelse, fase, belyst side, pol og helning, og over hvor Phobos og Deimos står ved siden av - klar av Mars, foran, bak eller i skyggen - for karttiden og stedet, ved det tidspunktet eller over et tidsrom. Månene beregnes for 2000 til 2049. Mars og månene tegnes på kartet med Mars på kartet.
marstable.title = Mars
marstable.a11y = Marstabell
marstable.explain = Hvor Mars og de to månene er, beregnet fra de medfølgende efemeridene for karttiden og observasjonsstedet: Mars' posisjon, høyde, avstand, tilsynelatende størrelse, belyst andel og fase, elongasjonen fra Solen og den belyste siden, retningen til nordpolen og hvor langt den polen heller mot deg, og for Phobos og Deimos hvilken side av Mars de er på, avstanden øst–vest og nord–sør, avstanden fra Mars og om hver er klar av Mars, foran, bak eller i skyggen. Månene beregnes for 2000 til 2049; utenfor de årene vises bare Mars. Mars og månene tegnes på kartet med Mars på kartet.
marstable.view.instant.a11y = Vis Mars og månene ved karttiden
marstable.view.instant.explain = Viser Mars ved karttiden, og under den Phobos og Deimos, i den rekkefølgen, utover fra Mars.
marstable.view.range.a11y = Vis Mars og månene over et tidsrom
marstable.view.range.explain = Viser Mars' sammendrag og de to månene for hvert steg fra starten til slutten, begge medregnet, gruppert under hvert tidspunkt; en slutt som ikke ligger på rutenettet, legges til som siste gruppe og merkes. Der månene ikke beregnes, vises Mars likevel, og gruppen sier det. Dette er utvalgte tidspunkter; tabellen leter ikke etter øyeblikket en måne går inn på eller ut av Marsskiven eller skyggen.
marstable.close.a11y = Lukk Marstabellen
marstable.time.note = Datoer før {0} og etter {1} bruker en beregnet klokkekorreksjon. Etter 2026 kan usikkerheten i lokale horisontkoordinater ennå ikke angis presist. Virkningen på J2000-posisjonen på kartet holder seg under 5″ fram til 2100 med den valgte modellen; der er månenes tilstand geometrien ved et beregnet tidspunkt, ikke forutsagte tidspunkter for hendelser. Phobos og Deimos beregnes for 2000 til 2049.
