# JUranometria på norsk bokmål (Sprint 33, issue #350).
#
# ---------------------------------------------------------------
# STATUS: DRAFT. Not yet reviewed by the owner.
# ---------------------------------------------------------------
#
# These are original translations written for this application, not
# taken from any source - unlike the constellation names, which are a
# reviewed catalogue with its own provenance. That makes their
# accuracy a matter of judgement rather than of citation, and
# judgement about Norwegian wording is the owner's.
#
# The manifest beside this file states status=draft, and the study
# reads its status from there rather than from a banner in Java. It
# becomes status=reviewed when a person who reads Norwegian has said
# these words are the ones an atlas should use.
#
# A key absent here falls back to English, visibly and on purpose.
# That is how this file can be incomplete - as it is, covering the
# Settings surface only - without anything reaching a reader as a key.
#
# Terms kept deliberately:
#
#   "Latin (IAU)"  a nomenclature, not a language the atlas speaks
#   --dark         a command-line flag, typed exactly as written

