# ---------------------------------------------------------------
# About (#350)
# ---------------------------------------------------------------
#
# Three kinds of words meet here and only one of them is below.
#
# TRANSLATABLE: the title, the description, the buttons, the
# explanations, and the seven headings over the bundled documents.
#
# IDENTITY: JUranometria, the version, Tycho-2, OpenNGC, Tabler and
# every licence identifier. Arguments, exact in every language.
#
# NOT HERE AT ALL: 25 235 bytes of upstream notice and licence text.
# No language pack reaches them; AboutText.noticesBody takes no
# language so that nothing can pass one to it.
#
# An apostrophe is doubled ONLY in a value with arguments, because
# only those go through MessageFormat. A value with no {0} is
# returned raw, and '' in one of those reaches a reader as two
# apostrophes.
#
# The compact summary is a DOCUMENT, not a key. A language that
# writes its own puts it at <tag>.about-summary.txt beside this file,
# and it is used whole or not at all - a licensing summary assembled
# from two languages is a legal statement nobody wrote.

