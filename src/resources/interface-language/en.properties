# ---- Saturn, its rings and the seven ruled moons (#576, the table ruled on #574) ----
saturntable.title = Saturn
saturntable.a11y = Saturn table
saturntable.explain = Where Saturn, its rings and its seven ruled moons are, computed from the bundled ephemerides for the chart time and place: Saturn's position, height, distance, apparent size, illuminated fraction and pole, how far its rings are open to you and to the Sun and how large they appear, and for Mimas, Enceladus, Tethys, Dione, Rhea, Titan and Iapetus their side of Saturn, their offsets east–west and north–south, their separation and whether each is clear of Saturn, in front of it, behind it or in its shadow. Saturn and its rings are drawn on the chart by Saturn on the chart; its seven moons with it, as 3-pixel symbols with their states.
saturntable.view.instant.a11y = Show Saturn and its moons at the chart time
saturntable.view.instant.explain = Shows Saturn and its rings at the chart time, and below them the seven moons in a fixed order, outward from Saturn.
saturntable.view.range.a11y = Show the seven moons over a range of instants
saturntable.view.range.explain = Shows Saturn's summary and the seven moons for every step from the start to the end, both included, grouped under each instant; an end that is not on the grid is added as the last group and marked. This samples the range; it does not search for the moment a moon enters or leaves Saturn's disc or shadow.
saturntable.close.a11y = Close the Saturn table
saturntable.time.note = Dates before {0} and after {1} use an estimated clock correction. After 2026, uncertainty in local horizon coordinates cannot yet be stated precisely. The effect on the J2000 chart position remains below 3″ through 2100 under the adopted model; there the moons' states are the geometry at an estimated instant, not predicted times of events.
