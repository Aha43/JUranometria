# ---- Inspector ----
#
# Counts are data placed beside a heading, never a word inflected by
# a number: "Objects here · 2". Embedding a plural rule would encode
# English's, and then Norwegian's, and then every language whose
# rules this schema does not model.
#
# Magnitudes and designations are arguments. A magnitude is formatted
# Locale.ROOT everywhere, because 2.96 is the value the atlas states
# and a comma there would read as a different number to anyone
# checking it against a catalogue.
