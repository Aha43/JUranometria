moontable.column.phase = Phase
moontable.column.phase.explain = The phase as a reader sees it: near new Moon, waxing crescent, near first quarter, waxing gibbous, near full Moon, waning gibbous, near last quarter or waning crescent. Waxing and waning follow the Moon's path around the Earth and are the same for every observer; "near" marks a band around the event, not its exact instant.
