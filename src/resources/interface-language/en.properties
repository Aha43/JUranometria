# ---------------------------------------------------------------
# The chart's keyboard (#350)
# ---------------------------------------------------------------
#
# Every sentence here is WHOLE. The palette used to build eleven of
# them out of Java string addition, which meant a translation could
# only ever come out in English order. The stress case is
# `spoken.unavailable`: a name, a condition naming another switch,
# and a two-keystroke shortcut.
#
# A master declares two forms of its own name because a label is not
# a sentence part. `master.enable` is what reads after "enable";
# `master.on` is a complete clause, which is where number agreement
# lives. The application used to lowercase a label to make it fit,
# which is a language's rule and not the atlas's.
#
# EVERY registered switch declares a note or declares `!none`.
# Notes explain why a letter differs from the one on the switch's
# own control, which is a fact about THIS language's mnemonics -
# another language may collide differently, or not at all. A missing
# key and a deliberate silence must not look the same, so silence is
# written down.

