# The words JUranometria says, in English (Sprint 33, issue #350).
#
# English is the language every other one falls back to, so a key
# missing from this file is a mistake rather than a translation gap:
# InterfaceText throws on it, and a contract catches it before a
# reader could meet it.
#
# ---------------------------------------------------------------
# Keys
# ---------------------------------------------------------------
#
# surface.element.role, where role is one of:
#
#   label    the words on the control itself
#   heading  a section title
#   a11y     the accessible name - what assistive technology says
#            INSTEAD of the visible words, so it names the control
#   explain  the accessible description and, where there is one, the
#            tooltip: what the control DOES, not what it is called
#   note     a sentence shown under some condition
#   title    a window title
#
# A key is not a sentence. Where a value belongs inside one, the
# value is a numbered argument in a single pattern - {0} - because
# languages disagree about word order and a sentence assembled from
# translated fragments is a sentence only in the language it was
# assembled for.

