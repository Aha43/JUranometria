# The headline over a startup failure.
#
# The REMEDIES are not here. They are multi-paragraph documents
# carrying a Windows registry path with real backslashes and a shell
# command spanning lines, and this file's grammar is one line per key
# with no escapes. A language writes them as whole documents beside
# this file - nb-NO.startup-bundled-data.txt and its two siblings -
# and the English stays embedded in StartupFailure itself, where
# nothing it might be reporting the failure of can stop it being
# read.
#
# So English defines the headline here for parity and never uses it:
# no en.startup-*.txt ships, the atomic rule finds no document, and
# the embedded English framing is used entire.
startup.failed = JUranometria could not start.

# ---------------------------------------------------------------
# The toolkit's own words, around the atlas's dialogs (#350)
# ---------------------------------------------------------------
#
# Swing supplies these from its own resource bundle, resolved against
# Locale.getDefault() - the OPERATING SYSTEM, not the language the
# reader chose. So an English interface on a German desktop answered
# an English question with "Ja" and "Nein", and a Norwegian interface
# answered a Norwegian one with "Yes" and "No", because the JDK ships
# no Norwegian bundle at all.
#
# The atlas installs its own over them, in both languages. That is a
# correction to mixed-language chrome, not a promise to reproduce the
# platform's wording.
#
# Forty-one keys. Six of them are PAIRS: a chooser button says one
# thing to a pointer and another to a screen reader, and translating
# only the visible half would leave it speaking English to whoever
# cannot see it.
#
# Access keys (Swing's `…Mnemonic` entries) are NOT here. They belong
# with the eighteen access letters already deferred.

