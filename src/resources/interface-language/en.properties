# ---- Chart Options ----
#
# The spoken description of a switch is ONE pattern, not a
# frame glued to fragments. The old builder appended
# ". Switched here..." to a description that already ended
# in a period, and five descriptions read "NGC 3628.." to a
# screen reader. {2} is a dependency's name as this language
# writes it in that position - never a visible label put
# through toLowerCase, which is English's rule and not
# every language's.
#
# {1} is the key sequence. Its glyphs and letter are
# notation; the word between them is language.
