solarsystem.neptune.onChart.label = Neptune on the chart
solarsystem.neptune.onChart.a11y = Neptune on the chart
solarsystem.neptune.onChart.explain = Shows or hides Neptune on the chart where it stands for the chart time and place, as a 6-pixel cartographic symbol: Neptune is never large enough to draw at its true size. It has no rings to draw. Triton and Nereid are drawn with it from 2000 to 2100, at the 1-degree field and the closer fields only, as 3-pixel symbols at their own places, each only where its mark stands clear of Neptune and of the other moon: a filled dot clear of Neptune, a hollow ring in its shadow; a moon behind Neptune, or too close to tell apart at the field, is not drawn, and the page says so. On wider fields the moons are not drawn. The same choice as View's.
menu.neptunechart.label = Neptune on the chart
