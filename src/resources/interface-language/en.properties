# The words JUranometria says, in English (Sprint 33, issue #350).
#
# English is the language every other one falls back to, so a key
# missing from this file is a mistake rather than a translation gap:
# InterfaceText throws on it, and a contract catches it before a
# reader could meet it.
#
# ---------------------------------------------------------------
# Keys
# ---------------------------------------------------------------
#
# surface.element.role, where role is one of:
#
#   label    the words on the control itself
#   heading  a section title
#   a11y     the accessible name - what assistive technology says
#            INSTEAD of the visible words, so it names the control
#   explain  the accessible description and, where there is one, the
#            tooltip: what the control DOES, not what it is called
#   note     a sentence shown under some condition
#   title    a window title
#
# A key is not a sentence. Where a value belongs inside one, the
# value is a numbered argument in a single pattern - {0} - because
# languages disagree about word order and a sentence assembled from
# translated fragments is a sentence only in the language it was
# assembled for.

settings.title = Settings
settings.a11y = Application appearance and language settings

settings.appearance.heading = Appearance
settings.appearance.light.label = Light
settings.appearance.light.a11y = Light appearance
settings.appearance.light.explain = Draws the window's own chrome light. The chart is drawn the same either way.
settings.appearance.dark.label = Dark
settings.appearance.dark.a11y = Dark appearance
settings.appearance.dark.explain = Draws the window's own chrome dark. The chart is drawn the same either way; the black sky is a chart option of its own.
settings.appearance.override.a11y = Dark override note
settings.appearance.override.note = This session was started with --dark; the chosen appearance applies from the next launch.

settings.language.heading = Language
settings.language.interface.label = Interface language
settings.language.interface.a11y = Interface language
settings.language.interface.hover = The language of the menus, buttons and dialogs - not the names printed on the chart
settings.language.interface.explain = The language of the menus, buttons and dialogs - the words the application speaks to you. It does not change the names printed on the chart, which are chosen separately below.
settings.language.chart.label = Names on chart
settings.language.chart.a11y = Names on chart
settings.language.chart.hover = The language of the constellation names printed on the chart - separate from the interface language
settings.language.chart.explain = The language of the constellation names printed on the chart itself. Separate from the interface language, so the sky can be named in your own language while the menus stay in another. "Follow interface" keeps the two together whatever the interface is set to; it says what it currently draws, because with one interface language installed it draws the same page as Latin.
settings.language.chart.follow = Follow interface — currently {0}
settings.language.chart.latin = Latin (IAU)
settings.language.selector.explain = Opens the list of languages to choose from

settings.ok.label = OK
settings.ok.a11y = OK
settings.ok.explain = Keeps the chosen appearance and closes this window
settings.cancel.label = Cancel
settings.cancel.a11y = Cancel
settings.cancel.explain = Closes this window and changes nothing
