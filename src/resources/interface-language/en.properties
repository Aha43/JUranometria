marstable.view.range.explain = Shows Mars's summary and its two moons for every step from the start to the end, both included, grouped under each instant; an end that is not on the grid is added as the last group and marked. Where the moons are not computed, Mars is still shown and the group says so. This samples the range; it does not search for the moment a moon enters or leaves Mars's disc or shadow.
marstable.close.a11y = Close the Mars table
