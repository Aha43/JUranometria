# ---------------------------------------------------------------
# The Sun table (Sprint 35, issue #400): the first Solar System
# reader surface. Where the Sun is, computed offline from the bundled
# DE440 excerpt for the observing place and instant Place and Time
# owns - one row for that instant, or a row for every step of a
# range. EVERY NUMBER IS AN ARGUMENT, pre-formatted in Locale.ROOT by
# juranometria.ui.solar.SunTableFormat and passed in already spelled,
# because a value must parse if a reader carries it into Place and
# Time. Frames and units are named in the column headings and their
# spoken descriptions. Nothing is drawn on the chart.
menu.sun.label = Sun...
menu.sun.mnemonic = S
menu.sun.a11y = Sun table
menu.sun.hover = Where the Sun is, for the chart time and place
menu.sun.explain = Opens a table of the Sun's computed position, height above the horizon, distance and apparent size for the chart time and place, at that instant or over a range of instants. Nothing is drawn on the chart.
suntable.title = The Sun
suntable.a11y = Sun table
suntable.explain = Where the Sun is, computed from the bundled ephemeris for the chart time and place: its position among the fixed stars, its height and direction above the mathematical horizon, its distance and how large it looks. One row for that instant, or a row for every step of a range. Nothing is drawn on the chart.
solartable.observer.note = Chart time {2} UTC at latitude {0}, longitude {1} east, from Place and Time.
solartable.observer.absent = Place and Time is not attached, so there is no observer to compute for.
solartable.view.instant.label = At chart time
solartable.view.instant.mnemonic = T
suntable.view.instant.a11y = Show the Sun at the chart time
solartable.view.instant.hover = One row, at the chart time
suntable.view.instant.explain = Shows a single row: the Sun at the chart time.
solartable.view.range.label = Over a time range
solartable.view.range.mnemonic = R
suntable.view.range.a11y = Show the Sun over a range of instants
solartable.view.range.hover = A row for every step from the chart time, over a span
solartable.view.range.explain = Shows a row for every step from the chart time over the span chosen, as many whole steps as the span holds; the first row is the chart time, read again whenever you compute. To range from another instant, set the chart time.
solartable.range.step.label = Every
solartable.range.step.mnemonic = V
solartable.range.step.a11y = Step between rows
solartable.range.step.hover = The elapsed time between rows
solartable.range.step.explain = The elapsed time between rows, on the UTC timeline, so a daily range does not drift across a change of civil clock.
solartable.step.hour = 1 hour
solartable.step.sixHours = 6 hours
solartable.step.day = 1 day
solartable.step.week = 7 days
solartable.step.month = 30 days
solartable.compute.label = Compute
solartable.compute.mnemonic = C
solartable.compute.a11y = Compute the range
solartable.compute.hover = Fill the table for the span and step above, from the chart time
solartable.compute.explain = Computes a row for every step of the span above, from the chart time now.
solartable.centre.label = Centre on chart
solartable.centre.mnemonic = H
solartable.centre.a11y = Centre the chart on this body
solartable.centre.hover = Compute what is typed and centre the chart on it, at a 1° field
solartable.centre.explain = Computes what is typed above, turns the body's chart layer on if it is off, centres the chart on the result's J2000 position at the narrowest normal field, 1°, and brings the chart window forward; this window stays open. A range centres on its first instant.
solartable.close.label = Close
solartable.close.mnemonic = L
suntable.close.a11y = Close the Sun table
suntable.centre.a11y = Centre the chart on the Sun
venustable.centre.a11y = Centre the chart on Venus
mercurytable.centre.a11y = Centre the chart on Mercury
solartable.close.explain = Closes the table. Nothing is changed or remembered; Place and Time keeps the place and instant.
solartable.status.rows = {0} rows.
solartable.refused.rows = That range asks for {0} rows and at most {1} are shown; shorten it or lengthen the step.
suntable.refused.interval = The Sun is computed for civil dates from {0} to {1}; {2} is outside that.
suntable.table.a11y = The Sun's computed quantities
suntable.table.explain = Each row is one instant. The columns are the instant in UTC; right ascension and declination in the J2000 frame the chart is drawn in; ecliptic longitude on the J2000 ecliptic; altitude above the mathematical horizon and azimuth from north through east, without refraction; distance from the observer; and the apparent diameter of the disc.
solartable.column.instant = Instant (UTC)
solartable.column.instant.explain = The instant in UTC, to the minute. "est." marks an instant whose clock correction is estimated; {0} marks a range end that was not on the grid.
solartable.column.ra = Right ascension (J2000)
suntable.column.ra.explain = Hours, minutes and seconds of time, in the ICRS/J2000 frame the chart is drawn in: where the Sun is among the fixed stars, as seen from the observing place, without aberration.
solartable.column.dec = Declination (J2000)
solartable.column.dec.explain = Degrees, minutes and seconds of arc, in the same frame.
suntable.column.longitude = Ecliptic longitude (J2000)
suntable.column.longitude.explain = Degrees along the J2000 ecliptic, measured from the fixed J2000 equinox. The equinoxes and solstices of a later year fall near, not exactly at, 0°, 90°, 180° and 270°, because the equinox itself moves.
solartable.column.altitude = Altitude (no refraction)
solartable.column.altitude.explain = Degrees above the mathematical horizon, without atmospheric refraction; below the horizon the number is kept and the status is added.
solartable.column.azimuth = Azimuth (from north through east)
solartable.column.azimuth.explain = Degrees from north through east: 90° is east, 180° south, 270° west.
suntable.column.distance = Distance
suntable.column.distance.explain = From the observer to the Sun's centre, in astronomical units and in millions of kilometres.
solartable.column.diameter = Apparent diameter
suntable.column.diameter.explain = How large the Sun's disc looks, in minutes and seconds of arc.
solartable.below = (below the horizon)
solartable.estimated = est.
solartable.appended = †
suntable.distance.pattern = {0} AU ({1} mill. km)
# The decimal separator of the reader-facing numbers in this table, by
# the owner's ruling on #400: a point in English, a comma in Norwegian.
# Typed values, fixtures and the study stay Locale.ROOT; this is applied
# to what is shown, never to what is parsed.
solartable.decimal = .
suntable.time.note = Dates before {0} and after {1} use an estimated clock correction. After 2026, uncertainty in local horizon coordinates cannot yet be stated precisely. The effect on the J2000 chart position remains below 6″ through 2100 under the adopted model.

# The Sun and the Moon on the chart (Sprint 37, issues #415 and #416): two View switches.
menu.sunchart.label = Sun on the chart
menu.sunchart.mnemonic = U
menu.sunchart.a11y = Sun on the chart
menu.sunchart.explain = Shows or hides the Sun on the chart, drawn at its true size where it stands for the chart time and place; below a drawn horizon it is dimmed and says so.
menu.venuschart.label = Venus on the chart
menu.venuschart.mnemonic = E
menu.venuschart.a11y = Venus on the chart
menu.venuschart.explain = Shows or hides Venus on the chart where it stands for the chart time and place, phased as the table says, at its true size or as a 6-pixel cartographic symbol, whichever is larger. Hidden until you ask.
menu.mercurychart.label = Mercury on the chart
menu.mercurychart.mnemonic = C
menu.mercurychart.a11y = Mercury on the chart
menu.mercurychart.explain = Shows or hides Mercury on the chart where it stands for the chart time and place, phased as the table says, at its true size or as a 6-pixel cartographic symbol, whichever is larger. Hidden until you ask.
menu.moonchart.label = Moon on the chart
menu.moonchart.mnemonic = O
menu.moonchart.a11y = Moon on the chart
menu.moonchart.explain = Shows or hides the Moon on the chart, drawn at its true size where it stands for the chart time and place, lit on the side the Moon table states; below a drawn horizon it is dimmed and says so.
menu.jupiterchart.label = Jupiter and moons on the chart
menu.jupiterchart.mnemonic = P
menu.jupiterchart.a11y = Jupiter and moons on the chart
menu.jupiterchart.explain = Shows or hides Jupiter on the chart where it stands for the chart time and place: at its true size once that is at least 6 pixels across, otherwise as a 6-pixel cartographic symbol, not its apparent diameter; below a drawn horizon it is dimmed and says so. Io, Europa, Ganymede and Callisto are drawn as 3-pixel symbols at their own places: a filled dot clear of Jupiter, a dot ringed in the page's ground in front of it, a hollow ring in its shadow, and nothing behind it; at wider fields only the moons whose marks can be told apart are drawn.

