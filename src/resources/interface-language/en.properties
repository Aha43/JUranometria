uranustable.explain = Where Uranus and its five largest moons are, computed from the bundled ephemerides for the chart time and place: Uranus's position, height, distance, apparent size, illuminated fraction and phase angle, the position of its north pole and how far that pole is tipped towards you, and for Miranda, Ariel, Umbriel, Titania and Oberon their side of Uranus, their offsets east–west and north–south, their separation and whether each is clear of Uranus, in front of it, behind it or in its shadow. The moons are computed for 2000 to 2100; before 2000 Uranus alone is shown. Uranus and its moons are drawn on the chart by Uranus on the chart.
uranustable.view.instant.a11y = Show Uranus and its moons at the chart time
