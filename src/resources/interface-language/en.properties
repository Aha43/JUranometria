menu.mars.explain = Opens a table of Mars's computed position, height, distance, size, phase, lit side, pole and tilt, and of where Phobos and Deimos stand beside it - clear of Mars, in front of it, behind it or in its shadow - for the chart time and place, at that instant or over a range of instants. The moons are computed for 2000 to 2049. Mars and its moons are drawn on the chart by Mars on the chart.
marstable.title = Mars
marstable.a11y = Mars table
marstable.explain = Where Mars and its two moons are, computed from the bundled ephemerides for the chart time and place: Mars's position, height, distance, apparent size, illuminated fraction and phase, its elongation from the Sun and lit side, the position of its north pole and how far that pole is tipped towards you, and for Phobos and Deimos their side of Mars, their offsets east–west and north–south, their separation and whether each is clear of Mars, in front of it, behind it or in its shadow. The moons are computed for 2000 to 2049; outside those years Mars alone is shown. Mars and its moons are drawn on the chart by Mars on the chart.
marstable.view.instant.a11y = Show Mars and its moons at the chart time
