# ---- Jupiter and the four Galilean moons (#474, the table ruled on #472) ----
jupitertable.title = Jupiter
jupitertable.a11y = Jupiter table
jupitertable.explain = Where Jupiter and its four large moons are, computed from the bundled ephemerides for the chart time and place: Jupiter's position, height, distance, apparent size, illuminated fraction and pole, and for Io, Europa, Ganymede and Callisto their side of Jupiter, their offsets east–west and north–south, their separation and whether each is clear of Jupiter, in front of it, behind it or in its shadow. The chart draws Jupiter only while Jupiter and moons on the chart is on.
jupitertable.view.instant.a11y = Show Jupiter and its moons at the chart time
jupitertable.view.instant.explain = Shows Jupiter at the chart time, and below it the four moons in a fixed order.
jupitertable.view.range.a11y = Show the four moons over a range of instants
jupitertable.view.range.explain = Shows the four moons for every step from the start to the end, both included, grouped under each instant; an end that is not on the grid is added as the last group and marked. This samples the range; it does not search for the moment a moon enters or leaves Jupiter's disc.
jupitertable.close.a11y = Close the Jupiter table
jupitertable.time.note = Dates before {0} and after {1} use an estimated clock correction. After 2026, uncertainty in local horizon coordinates cannot yet be stated precisely. The effect on the J2000 chart position remains below 3″ through 2100 under the adopted model; there the moons' states are the geometry at an estimated instant, not predicted times of events.
