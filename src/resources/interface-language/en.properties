# ---------------------------------------------------------------
# The drawn page, and the files it is exported into (#350)
# ---------------------------------------------------------------
#
# These reach a reader three ways: the title block drawn on the
# chart, the description a screen reader hears, and the metadata
# written inside every exported SVG, PDF and PNG.
#
# EVERY NUMBER IS AN ARGUMENT, pre-formatted with Locale.ROOT by the
# caller. A magnitude limit of 6.0 is 6.0 to every reader; 6,0 in a
# title block would be a different number to half of them. No
# language reformats a chart value, and none can: they arrive as
# text.
#
# Canonical and untranslated: ICRS J2000, V, the degree sign, the
# separator, RA, Dec, mm, A4, the application's name, its version
# and its repository URL.
#
# The two identity maps at the end turn a stored token into a
# reader's phrase. `white-paper` reads as `white-paper` in English on
# purpose - every exported file the atlas has written says
# `Ground: white-paper.`, and this is a seam, not an output change.
# Norwegian will say something else, which is what makes it a
# mapping rather than an identity.

# A star's designation is canonical; which catalogue it comes from
# is a phrase beside it. The spacing and brackets were Java's.
