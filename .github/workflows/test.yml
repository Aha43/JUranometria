# The required check behind docs/development.md's merge rule: every
# pull request to main (and every push to main) compiles and runs the
# full test suite on the recorded JDK 21 baseline, bootstrapping the
# pinned dependencies with the POSIX bootstrap script.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch at a time (issue #323). This workflow carries the
# two slow jobs - the display journeys and the evidence contract, which
# together outlast several pushes to an active pull request - and
# without a group each push started another full set beside the ones
# already running. A superseded run cannot say anything about the head
# commit, so it is cancelled rather than raced.
#
# Never on `main`: a push there is the commit the branch protection
# answered for, and cancelling one would leave a merged commit whose
# required checks were killed halfway. The condition names the ref so
# the queue is per branch, and the fallback is the run id, which is
# unique - so a push to main groups only with itself and never
# cancels.
concurrency:
  group: >-
    test-${{ github.event_name == 'pull_request'
      && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache pinned dependencies
        uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - name: Bootstrap pinned dependencies
        run: scripts/download-libs.sh
      - name: Compile and run the test suite
        run: make test
        # Headless. This is the required check and it stays fast and
        # unconditional; what it cannot do is run the journeys that
        # need a screen, which is what the job below is for.

  # The display-dependent journeys (issue #209). Nineteen tests abort
  # in the headless job - every one that drives a real window - and
  # for the whole of Sprint 23 that meant `main` could be red on a
  # maintainer's machine while every check here was green. A gate
  # with a hole in it.
  #
  # xvfb gives them a screen, and a virtual one is better than a
  # developer's: nothing else competes for the desktop, so a window
  # that asks for focus gets it. #209 was exactly a focus request
  # refused because another application held the desktop.
  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - run: scripts/download-libs.sh
      - name: Run the whole suite on a virtual display
        # Once, and then read every counter. Zero aborted is not
        # enough on its own: a run that found three tests and
        # passed them reports zero aborted too (#209 review). So
        # the whole tally has to agree - everything found was
        # started, everything started succeeded, and nothing was
        # skipped, aborted or failed.
        run: |
          set -o pipefail
          xvfb-run -a make test 2>&1 | tee display-run.txt
          count() {
            grep -oE "[0-9]+ tests $1" display-run.txt \
              | grep -oE '[0-9]+' | head -1
          }
          found=$(count found)
          started=$(count started)
          ok=$(count successful)
          failed=$(count failed)
          aborted=$(count aborted)
          skipped=$(count skipped)
          echo "on a display: found=$found started=$started" \
               "successful=$ok failed=$failed aborted=$aborted" \
               "skipped=$skipped"
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$found" ] && [ -n "$ok" ] \
            || fail 'the display run produced no test tally at all'
          # A floor, so a suite that silently shrank cannot pass
          # by running almost nothing. Raise it as the suite
          # grows; it is deliberately well below the real count.
          [ "$found" -ge 500 ] \
            || fail "only $found tests found on the display run"
          [ "$found" = "$started" ] \
            || fail "$found found but $started started"
          [ "$ok" = "$found" ] \
            || fail "$found found but only $ok succeeded"
          [ "$failed" = 0 ] || fail "$failed failed on a display"
          [ "$skipped" = 0 ] || fail "$skipped skipped"
          # The one this job exists for: every journey that needs
          # a screen must actually have run.
          [ "$aborted" = 0 ] \
            || fail "$aborted aborted on a display run; this job" \
                    'exists so that cannot happen quietly'

  # Generated evidence, checked against its own generators (issue
  # #315). `make test` never runs this, and at the end of #314 the
  # contract had 107 breaches nobody had seen: moving where labels
  # are drawn moved every renderer-drawn study page in the
  # repository, and one report had not been reproducible since the
  # sprint that promoted it. A gate nobody runs reports its findings
  # to nobody, so it runs here.
  #
  # On a display, because the study pages are rendered - and with the
  # portable contract, which never compares a rendering made here with
  # pixels recorded on somebody else's machine. See
  # docs/decisions/test-evidence.md, "Three kinds of evidence".
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - run: scripts/download-libs.sh
      - name: Reproduce every generated artifact from its generator
        # The pixel-exact families are a fact about a machine's fonts
        # and 2D pipeline, so what this job holds is what holds
        # anywhere: the deterministic reports, the geometry digests
        # and the promoted pages' own arithmetic. The contract says
        # which is which and skips out loud where a family cannot be
        # verified from a clean checkout.
        run: xvfb-run -a make evidence-contracts-ci
