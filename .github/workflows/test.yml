# The required check behind docs/development.md's merge rule: every
# pull request to main (and every push to main) compiles and runs the
# full test suite on the recorded JDK 21 baseline, bootstrapping the
# pinned dependencies with the POSIX bootstrap script.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache pinned dependencies
        uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - name: Bootstrap pinned dependencies
        run: scripts/download-libs.sh
      - name: Compile and run the test suite
        run: make test
