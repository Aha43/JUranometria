# The 1.0 archive verification of issue #144: build the exact
# release artifact once, then unpack and verify that same artifact on
# macOS, Linux, and Windows with JDK 21 - contents asserted, the
# packaged headless smoke render exercised from a path containing a
# space, and a real GUI launch where the runner permits (xvfb on
# Linux; the macOS and Windows runners have display sessions). The
# required branch-protection check remains the separate `test`
# workflow.
name: dist

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - run: scripts/download-libs.sh
      - name: Build twice and require byte-identical archives
        run: |
          make dist
          cp build/dist/*.zip /tmp/first.zip
          make dist
          cmp build/dist/*.zip /tmp/first.zip
          echo "deterministic: two consecutive builds byte-identical"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-archive
          path: build/dist/*.zip
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          name: dist-archive
          path: dist
      - name: Verify the exact artifact (contents, notice, packaged smoke, space path)
        shell: bash
        run: scripts/verify-dist.sh dist/*.zip
      - name: GUI launch THROUGH the shipped helpers, light and --dark
        shell: bash
        run: |
          set -eu
          work="$RUNNER_TEMP/gui with space"
          mkdir -p "$work"
          unzip -q dist/*.zip -d "$work"
          appdir=$(echo "$work"/JUranometria-*)
          launch() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              "$appdir/juranometria.bat" "$@" &
            elif [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "$appdir/juranometria" "$@" &
            else
              "$appdir/juranometria" "$@" &
            fi
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "packaged helper launch died ($*)"; wait "$pid"; exit 1
            fi
            kill "$pid" 2>/dev/null || true
            if [ "$RUNNER_OS" = "Windows" ]; then
              taskkill //IM java.exe //F >/dev/null 2>&1 || true
            fi
            wait "$pid" 2>/dev/null || true
          }
          launch
          launch --dark
          # java -jar stays the authoritative fallback: prove it too.
          java --enable-native-access=ALL-UNNAMED \
            -jar "$appdir/JUranometria.jar" &
          pid=$!; sleep 8
          kill -0 "$pid" 2>/dev/null || { echo "java -jar died"; exit 1; }
          kill "$pid" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //IM java.exe //F >/dev/null 2>&1 || true
          fi
          wait "$pid" 2>/dev/null || true
          echo "helper + java -jar launches OK, light and --dark, space path"
      - name: Helper diagnostics for missing and pre-21 Java
        shell: bash
        run: |
          set -eu
          appdir=$(echo "$RUNNER_TEMP"/"gui with space"/JUranometria-*)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Restrict PATH to System32 (cmd builtins + where.exe, no
            # java): the batch helper must refuse readably.
            out=$(cmd //c "set PATH=C:\\Windows\\System32&& \"$(cygpath -w "$appdir")\\juranometria.bat\"" 2>&1) && {
              echo "batch helper did not fail without java"; exit 1; }
            echo "$out" | grep -q "Java runtime" || {
              echo "batch helper diagnostic missing: $out"; exit 1; }
            echo "windows missing-java diagnostic OK"
          else
            fake="$RUNNER_TEMP/fake17"; mkdir -p "$fake"
            printf '#!/bin/sh\necho "openjdk version \\"17.0.9\\"" >&2\n' > "$fake/java"
            chmod +x "$fake/java"
            out=$(PATH="$fake:$PATH" "$appdir/juranometria" 2>&1) && {
              echo "helper did not refuse java 17"; exit 1; }
            echo "$out" | grep -q "Java 21 or later" || {
              echo "old-java diagnostic missing: $out"; exit 1; }
            miss="$RUNNER_TEMP/nojava"; mkdir -p "$miss"
            for t in sh sed head dirname pwd grep; do
              ln -sf "$(command -v $t)" "$miss/$t" 2>/dev/null || true
            done
            out=$(env PATH="$miss" "$appdir/juranometria" 2>&1) && {
              echo "helper did not refuse missing java"; exit 1; }
            echo "$out" | grep -q "None was found" || {
              echo "missing-java diagnostic missing: $out"; exit 1; }
            echo "posix old-java and missing-java diagnostics OK"
          fi
