# The 1.0 archive verification of issue #144: build the exact
# release artifact once, then unpack and verify that same artifact on
# macOS, Linux, and Windows with JDK 21 - contents asserted, the
# packaged headless smoke render exercised from a path containing a
# space, and a real GUI launch where the runner permits (xvfb on
# Linux; the macOS and Windows runners have display sessions). The
# required branch-protection check remains the separate `test`
# workflow.
name: dist

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('scripts/lib-versions.env') }}
      - run: scripts/download-libs.sh
      - run: make dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-archive
          path: build/dist/*.zip
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          name: dist-archive
          path: dist
      - name: Verify the exact artifact (contents, notice, packaged smoke, space path)
        shell: bash
        run: scripts/verify-dist.sh dist/*.zip
      - name: GUI launch, light and --dark (xvfb on Linux)
        shell: bash
        run: |
          set -eu
          work="$RUNNER_TEMP/gui with space"
          mkdir -p "$work"
          unzip -q dist/*.zip -d "$work"
          appdir=$(echo "$work"/JUranometria-*)
          launch() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a java --enable-native-access=ALL-UNNAMED \
                -jar "$appdir/JUranometria.jar" "$@" &
            else
              java --enable-native-access=ALL-UNNAMED \
                -jar "$appdir/JUranometria.jar" "$@" &
            fi
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "packaged GUI launch died ($*)"; wait "$pid"; exit 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          launch
          launch --dark
          echo "GUI launch OK, light and --dark, from a path with a space"
