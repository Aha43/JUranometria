# Publication of a release from an annotated vX.Y.Z tag (issue #88),
# replacing the manual procedure used through 0.17.0.
#
#   agree -> build (the SAME workflows that gate every pull request)
#         -> stage and verify the five -> publish once, as a draft
#            made public only when all six assets are present
#
# Three rules decide the shape (automation review):
#
#  1. ONLY a tag push can publish. A manual run is always a
#     rehearsal, whatever it is asked for and whatever ref it is
#     started from, and its jobs never hold write access at all.
#  2. The tag must be ANNOTATED, must point at the commit being
#     built, and that commit must already be ON origin/main - a
#     release is published from reviewed, merged work or not at all.
#     Checked before anything is built, and checked AGAIN
#     immediately before the draft is created, because a tag can be
#     force-moved while a build runs.
#  3. An existing release for the tag is examined, not assumed
#     (#195). One tag push can be DELIVERED twice; the loser of that
#     race must finish green having done nothing, while a release
#     this run did not build must still fail loudly.
#  4. A public release is never assembled in stages. The release is
#     created as a draft, every asset is uploaded and then read back
#     from GitHub, and only a complete set is made public - so a
#     failed upload leaves an invisible draft, not a public release
#     missing a platform.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to rehearse (default: v + VERSION)'
        required: false
        type: string

# Least privilege: read for everything, and write only in the one
# job that can publish - which itself runs only on a tag push.
permissions:
  contents: read

# One release run per tag at a time, and never cancelled: two runs
# for the same tag must not race to publish it, and a run that is
# mid-upload must be allowed to finish or fail on its own terms.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  agreement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the tag under release
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            tag='${{ github.ref_name }}'
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            tag='${{ github.event.inputs.tag }}'
          else
            tag="v$(tr -d ' \t\r\n' < VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"
      # Provenance, before anything is built. Rehearsals skip it:
      # they cannot publish, so an unmerged branch is exactly what
      # one is for.
      - name: The tag must be annotated, ours, and on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          scripts/release-provenance.sh "$TAG" "$GITHUB_SHA"
      - name: Tag, VERSION and CHANGELOG must agree
        run: scripts/release-metadata.sh check "${{ steps.resolve.outputs.tag }}"
      - name: Assemble the release notes
        run: |
          scripts/release-metadata.sh notes \
            "${{ steps.resolve.outputs.tag }}" . release-notes.md
          echo "--- notes ---"
          cat release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The application images and the portable archive, built and
  # verified by the workflows that already gate every change: native
  # per-platform builds, packaged acceptance, licensing inventory,
  # determinism, and the cross-architecture smoke comparison. A
  # failure in any of them means nothing reaches publication.
  images:
    needs: agreement
    uses: ./.github/workflows/app-image.yml
    permissions:
      contents: read

  portable:
    needs: agreement
    uses: ./.github/workflows/dist.yml
    permissions:
      contents: read

  # Naming and verification happen with no write access, whatever
  # started the run, so the publishing job receives a set that has
  # already passed the gate.
  stage:
    needs: [agreement, images, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.agreement.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: incoming
      - name: Name the five artifacts as the contract publishes them
        run: |
          mkdir -p staging
          for cell in macos-arm64 macos-x64 windows-x64 linux-x64; do
            cp "incoming/app-image-$cell/image.zip" \
               "staging/JUranometria-$VERSION-$cell.zip"
          done
          cp "incoming/dist-archive/JUranometria-$VERSION.zip" \
             "staging/JUranometria-$VERSION-portable.zip"
          cp incoming/release-notes/release-notes.md staging/
      - name: Verify the set and write its checksums
        run: scripts/release-artifacts.sh "$VERSION" staging "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.agreement.outputs.version }}
          path: staging/
          if-no-files-found: error

  # The only job that can write, and it exists only for a tag push.
  publish:
    needs: [agreement, stage]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.agreement.outputs.tag }}
      VERSION: ${{ needs.agreement.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: release-${{ needs.agreement.outputs.version }}
          path: staging
      # Again, now: the build took minutes, and a tag can be
      # force-moved in minutes. This is the check that stops an
      # older run from publishing artifacts the tag no longer names.
      - name: Re-verify provenance immediately before publishing
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          scripts/release-provenance.sh "$TAG" "$GITHUB_SHA"
      # An existing release for this tag is two different situations
      # and only one of them is wrong (#195). GitHub delivered the
      # v1.3.0 push twice; the second run refused, rightly, and left
      # a red X on a correct release. Read the release back and let
      # it say which case this is.
      - name: Read back any release that already holds this tag
        id: existing
        run: |
          mkdir -p published
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets > published/release.json 2>/dev/null
          then
            echo "no release holds $TAG; this run publishes it"
            echo "benign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A draft is never adopted. It is unfinished work someone
          # left behind - possibly a failed run of this very
          # workflow - and completing it silently is precisely the
          # surprise the draft-then-publish shape exists to prevent.
          if [ "$(jq -r .isDraft published/release.json)" = true ]; then
            echo "::error::a DRAFT release already exists for $TAG."
            echo "A draft is unfinished work, not another delivery"
            echo "of this push. Inspect it and delete it"
            echo "deliberately, then re-run."
            exit 1
          fi
          jq -r '.assets[].name' published/release.json \
            > published/assets.txt
          # Every asset, not a sample: a truncated or substituted
          # archive keeps its name and its manifest line, so the
          # only way to catch it is to fetch the bytes and hash
          # them (#195 review). Best effort - what cannot be
          # downloaded is diagnosed by the script, with the name of
          # what is missing, rather than as an opaque failure here.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir published || true
          scripts/release-duplicate.sh "$VERSION" staging published \
            "$GITHUB_SHA"
          echo "benign=true" >> "$GITHUB_OUTPUT"
      - name: Create the release as a draft
        if: steps.existing.outputs.benign != 'true'
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "JUranometria $VERSION" \
            --notes-file staging/release-notes.md
      - name: Upload every asset
        if: steps.existing.outputs.benign != 'true'
        run: |
          cd staging
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            JUranometria-"$VERSION"-macos-arm64.zip \
            JUranometria-"$VERSION"-macos-x64.zip \
            JUranometria-"$VERSION"-windows-x64.zip \
            JUranometria-"$VERSION"-linux-x64.zip \
            JUranometria-"$VERSION"-portable.zip \
            SHA256SUMS.txt
      - name: Read the assets back before making anything public
        if: steps.existing.outputs.benign != 'true'
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > uploaded.txt
          for cell in macos-arm64 macos-x64 windows-x64 linux-x64 \
                      portable; do
            echo "JUranometria-$VERSION-$cell.zip"
          done > wanted.txt
          echo "SHA256SUMS.txt" >> wanted.txt
          sort -o wanted.txt wanted.txt
          if ! diff wanted.txt uploaded.txt; then
            echo "::error::the draft does not hold exactly the six"
            echo "published files; it stays a draft. Nothing public"
            echo "was created."
            exit 1
          fi
          echo "all six assets present on the draft"
      - name: Make it public
        if: steps.existing.outputs.benign != 'true'
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false
          echo "published $TAG"
      # The whole point of #195: a duplicate delivery finishes green
      # and says why, so that a red run in this list always means
      # something is actually wrong.
      - name: Record the duplicate delivery
        if: steps.existing.outputs.benign == 'true'
        run: |
          echo "::notice::$TAG was already published by another delivery of the same push; nothing to do, nothing changed."
          {
            echo "## $TAG was already published"
            echo
            echo "Another delivery of this same tag push published"
            echo "it first. This run built and verified the same"
            echo "release, read the published one back, and confirmed"
            echo "the reproducible portable archive matches its own"
            echo "byte for byte."
            echo
            echo "Nothing was uploaded, replaced or deleted."
          } >> "$GITHUB_STEP_SUMMARY"

  # A manual run ends here: everything was built and verified, and
  # this job cannot publish even if it wanted to - it holds read
  # access only.
  rehearsal:
    needs: [agreement, stage]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.agreement.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-${{ needs.agreement.outputs.version }}
          path: staging
      - name: Report what a real tag would publish
        run: |
          {
            echo "## Rehearsal for $TAG — nothing published"
            echo
            echo "Built by the same workflows that gate every pull"
            echo "request, verified as a set, and summed:"
            echo
            echo '```'
            cat staging/SHA256SUMS.txt
            echo '```'
            echo
            echo "### The notes this tag would publish"
            echo
            cat staging/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
